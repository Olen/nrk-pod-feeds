<!DOCTYPE html>
<html lang="no">
    <head>
        <title>NRK Podcast RSS feeds</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="A selection of podcasts from NRK as RSS feeds, with the latest episodes. Unofficial, for personal use. Et utvalg podkaster fra NRK i RSS-format, med de siste episodene. Uoffisiell, for privat bruk." />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src https://gfx.nrk.no data:;">
        <link href="assets/css/style.css" rel="stylesheet">
    </head>

    <body onload="listFeeds()">
        <h1>NRK Podcast RSS feeds</h1>
        <a class="gh_link" href="https://github.com/Olen/nrk-pod-feeds">https://github.com/Olen/nrk-pod-feeds</a>

        <aside class="disclaimer">
            <p><strong>Kun til privat bruk.</strong> Denne siden er ikke tilknyttet NRK. Opphavsrett på alt innhold tilhører NRK og eventuelle andre rettighetshavere – se <a href="https://www.nrk.no/etikk/opphavsrett-pa-nrk.no-1.2843522" target="_blank" rel="noopener">NRKs vilkår for opphavsrett</a>. Ikke videredistribuer feedene offentlig eller bruk dem kommersielt.</p>
        </aside>

        <div class="legend" id="legend" aria-label="Filtrer etter status">
            <button type="button" class="legend-item status-active"   data-filter="status-active"   aria-pressed="true" title="Ny episode publisert de siste 30 dagene. Klikk for å skjule."><span class="status-dot">▶</span> Aktiv</button>
            <button type="button" class="legend-item status-paused"   data-filter="status-paused"   aria-pressed="true" title="Ingen nye episoder de siste 30 dagene. Klikk for å skjule."><span class="status-dot">⏸</span> Pauset</button>
            <button type="button" class="legend-item status-obsolete" data-filter="status-obsolete" aria-pressed="false" title="Ingen nye episoder på over et år. Klikk for å vise."><span class="status-dot">⏹</span> Inaktiv (over et år)</button>
        </div>

        <input type="text" id="searchInput" placeholder="Søk etter podkast...">

        <ul id="feeds_list"></ul>

        <script type="text/javascript" src="feeds.js"></script>
        <script type="text/javascript" src="assets/js/main.js"></script>
    </body>
</html>
