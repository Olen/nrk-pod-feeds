<!DOCTYPE html>
<html lang="no">
    <head>
        <title>NRK Podcast RSS feeds</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="A selection of podcasts from NRK as RSS feeds, with the latest episodes. Unofficial, for personal use. Et utvalg podkaster fra NRK i RSS-format, med de siste episodene. Uoffisiell, for privat bruk." />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src https://gfx.nrk.no data:;">
        <link href="assets/css/style.css" rel="stylesheet">
    </head>

    <body onload="listFeeds()">
        <h1>NRK Podcast RSS feeds</h1>
        <a class="gh_link" href="https://github.com/Olen/nrk-pod-feeds">https://github.com/Olen/nrk-pod-feeds</a>

        <div class="legend">
            <span class="legend-item status-active"   title="Ny episode publisert de siste 30 dagene."><span class="status-dot">▶</span> Aktiv</span>
            <span class="legend-item status-paused"   title="Ingen nye episoder de siste 30 dagene."><span class="status-dot">⏸</span> Pauset</span>
            <span class="legend-item status-obsolete" title="Ingen nye episoder på over et år."><span class="status-dot">⏹</span> Inaktiv (over et år)</span>
        </div>

        <input type="text" id="searchInput" onkeyup="searchFeeds()" placeholder="Søk etter podkast...">

        <ul id="feeds_list"></ul>

        <script type="text/javascript" src="feeds.js"></script>
        <script type="text/javascript" src="assets/js/main.js"></script>
    </body>
</html>
